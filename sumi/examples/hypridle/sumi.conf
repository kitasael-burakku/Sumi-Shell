# hypridle para Sumi Shell (portabilidad F5d, 2026-10-10). Inclúyelo en tu ~/.config/hypr/hypridle.conf con
#   source = ~/.config/quickshell/sumi/examples/hypridle/sumi.conf
# o copia el bloque general a tu archivo. hypridle sólo lee su config al arrancar: reinícialo después
# (systemctl --user restart hypridle, o vuelve a entrar en la sesión si lo lanzas con exec-once).
general {
    # El botón Lock de la shell, el atajo y la inactividad piden `loginctl lock-session`; esto lo atiende con el
    # helper de la shell (bloquea Sumi Shell; si no puede, hyprlock, la red de seguridad).
    lock_cmd = ~/.config/quickshell/sumi/scripts/sumi-lock
    # Antes de suspender: el mismo helper, sin animación de entrada.
    before_sleep_cmd = ~/.config/quickshell/sumi/scripts/sumi-lock instant
    # Explícito: sin la palabra «hyprlock» en lock_cmd, el modo automático de hypridle no esperaría al bloqueo antes de
    # suspender (docs/lock/SEGURIDAD.md R3).
    inhibit_sleep = 3
}

# Bloquear tras 5 min sin actividad. Settings → System → Power puede gestionar los plazos (archivo propio) si hypridle
# corre como servicio de usuario.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Apagar la pantalla a los 10 min: el dispatch depende del dialecto de tu config de Hyprland (deja SÓLO uno).
listener {
    timeout = 600
    # con hyprland.conf (hyprlang):
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
    # con hyprland.lua:
    # on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    # on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
