# Sumi Shell para Hyprland con hyprland.conf (hyprlang; medido en 0.56.2). Portabilidad F5h; validado con
# `Hyprland --verify-config` y cargado en un Hyprland anidado (tools/f5/acceptance-check.py).
#
# SÓLO PARA HYPRLAND ≤ 0.56. Hyprland 0.57 ya no lee hyprland.conf (sólo Lua): usa sumi.lua. Este archivo queda
# CONGELADO (2026-10-30) para quien siga en 0.56 o antes: no se le añade nada nuevo salvo los atajos públicos, que
# deben coincidir con sumi/lib/shortcuts.json (la tabla de las teclas por defecto, la que usa install.sh desde la
# ayuda de atajos del 2026-10-30), con sumi.lua y con api/contract-v1.json (tests/api/api-check.py lo comprueba).
#
# Cópialo a ~/.config/hypr/sumi.conf y añade al final de tu hyprland.conf:
#     source = ~/.config/hypr/sumi.conf
# La shell no edita tu config: este archivo es tuyo. Cambia las teclas que choquen con las tuyas.

# Arranque. Lo normal es la unidad de systemd del proyecto (sumi/systemd/sumi-shell.service), que necesita
# WAYLAND_DISPLAY y HYPRLAND_INSTANCE_SIGNATURE en el gestor de usuario: Hyprland las exporta solo al arrancar (salvo
# con HYPRLAND_NO_SD_VARS) y uwsm también. Si NO usas la unidad, quita el comentario:
# exec-once = qs -c sumi --no-duplicate

# Bloqueo: retomar el bloqueo si la shell cae con la sesión bloqueada, y transiciones con el escritorio vivo.
misc {
    allow_session_lock_restore = true
    session_lock_xray = true
}

# Vidrio en la capa principal (opcional). Sintaxis de 0.56 (la de antes, `layerrule = blur, <ns>`, ya no vale).
layerrule = match:namespace sumi-shell, blur on, ignore_alpha 0.4

# Los 29 atajos globales (appid sumi; core/Shortcuts.qml) con sus teclas POR DEFECTO, las oficiales de la shell
# (sumi/lib/shortcuts.json; no tienen por qué ser las del autor). Con hyprland.conf `hyprctl binds` dice el nombre
# del atajo, así que la ayuda de atajos de la shell reconoce cada tecla sin descripción.
bind = SUPER, space, global, sumi:launcher
bind = SUPER, W, global, sumi:wallpaper
bind = SUPER CTRL, W, global, sumi:wallhaven
bind = SUPER CTRL, R, global, sumi:wallRandom
bind = SUPER CTRL, S, global, sumi:settings
bind = SUPER, Y, global, sumi:system
bind = SUPER CTRL, Y, global, sumi:monitor
bind = SUPER, A, global, sumi:mixer
bind = SUPER SHIFT, A, global, sumi:audio
bind = SUPER SHIFT, slash, global, sumi:web
bind = SUPER, Escape, global, sumi:power
bind = SUPER SHIFT, V, global, sumi:clipboard
bind = SUPER, period, global, sumi:emoji
bind = SUPER, N, global, sumi:wifi
bind = SUPER CTRL, N, global, sumi:controlCenter
bind = SUPER CTRL, B, global, sumi:bluetooth
bind = SUPER, C, global, sumi:calendar
bind = SUPER CTRL, C, global, sumi:calendarUi
bind = SUPER CTRL, L, global, sumi:loginScreen
bind = SUPER, R, global, sumi:recorder
bind = SUPER CTRL, D, global, sumi:dashboard
bind = SUPER CTRL, T, global, sumi:tasks
bind = ALT, Tab, global, sumi:minimizer
bind = SUPER, U, global, sumi:services
bind = SUPER, T, global, sumi:theme
bind = SUPER CTRL, P, global, sumi:barToggle
bind = SUPER CTRL, space, global, sumi:peek
bind = SUPER CTRL, X, global, sumi:cli
bind = SUPER CTRL, K, global, sumi:keepAwake
bind = SUPER CTRL, A, global, sumi:notifications
bind = SUPER, F1, global, sumi:keybinds
